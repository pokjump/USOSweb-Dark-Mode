<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --canvas: #12151b;
        --surface: #1e232c;
        --border: #272c36;
        --text: #c7ccd6;
        --text-dim: #8f96a4;
        --gold: #dda94f;
      }
      body {
        margin: 0;
        width: 248px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--canvas);
        color: var(--text);
      }
      .wrap { padding: 16px; }
      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 12px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        cursor: pointer;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      input[type='checkbox'] {
        flex: none;
        width: 36px;
        height: 20px;
        appearance: none;
        margin: 0;
        background: #333a46;
        border-radius: 999px;
        position: relative;
        cursor: pointer;
        outline: none;
        transition: background 0.15s ease;
      }
      input[type='checkbox']::before {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #c7ccd6;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      input[type='checkbox']:checked { background: var(--gold); }
      input[type='checkbox']:checked::before {
        transform: translateX(16px);
        background: #12151b;
      }
      input[type='checkbox']:focus-visible { box-shadow: 0 0 0 2px #3d4757; }
      p.hint {
        font-size: 11px;
        color: var(--text-dim);
        margin: 12px 2px 0;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>USOSweb Dark Mode</h1>
      <label>
        Ciemny motyw
        <input type="checkbox" id="toggle" />
      </label>
      <p class="hint" id="hint"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
